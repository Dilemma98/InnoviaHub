name: Build and deploy React (TypeScript) to Azure Web App - InnoviaHubFrontend

on:
  push:
    branches: [ AzureFrontend ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    # Ändra om din frontend ligger i en undermapp, t.ex. client/ eller frontend/
    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build (React)
        env:
          REACT_APP_API_URL: https://innoviahub-backend-had9greebjazakbe.swedencentral-01.azurewebsites.net
        run: |
          npm ci
          npm run build

      - name: Add SPA web.config (for React Router)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <rewrite>
                <rules>
                  <rule name="SPA Fallback" stopProcessing="true">
                    <match url=".*" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="/index.html" />
                  </rule>
                </rules>
              </rewrite>
              <staticContent>
                <remove fileExtension=".json" />
                <mimeMap fileExtension=".json" mimeType="application/json" />
              </staticContent>
            </system.webServer>
          </configuration>
          "@ | Out-File -FilePath dist/web.config -Encoding utf8

      - name: Upload artifact (build only)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_YOURID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_YOURID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_YOURID }}

      - name: Deploy to Azure Web App (dist/)
        uses: azure/webapps-deploy@v3
        with:
          app-name: InnoviaHubFrontend
          slot-name: Production
          package: dist

