name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - AzureFrontend   # Branchen du vill deploya från
  pull_request:
    branches:
      - AzureFrontend

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      id-token: write
    steps:
      # 1️⃣ Checka ut koden
      - uses: actions/checkout@v3

      # 2️⃣ Installera Node (om du använder Node-baserad frontend)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3️⃣ Installera dependencies
      - name: Install dependencies
        run: npm install
        working-directory: ./Frontend

      # 4️⃣ Bygg appen
      - name: Build app
        run: npm run build
        working-directory: ./Frontend

      # 5️⃣ Deploy till Azure Static Web App
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_COAST_029C51C03 }}
          action: "upload"
          app_location: "./Frontend"      # App-kodens location
          output_location: "dist"        # Byggmappen, t.ex. "build" för React, "dist" för Vue/Angular
          api_location: ""                # Om du inte har API
